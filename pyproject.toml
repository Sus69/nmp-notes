[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmp-notes"
version = "0.1.0"
description = "A CLI tool and Python library for generating prefilled practical lab files from templates."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "kc9ru", email = "kc9ru@protonmail.com" }
]
keywords = ["education", "templates", "lab", "practicals", "cli", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Sus69/nmp-notes"
Repository = "https://github.com/Sus69/nmp-notes"
Issues = "https://github.com/Sus69/nmp-notes/issues"

[project.scripts]
nmp = "nmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nmp = [
    "templates/**/*.py",
]
